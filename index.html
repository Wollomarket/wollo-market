    function sendAi(txt) {
      const clean = txt.trim();
      if (!clean) return;
      state.aiMsgs.push({ r: "user", txt: clean });
      state.aiMsgs.push({ r: "bot", txt: aiReply(clean) });
      renderAi();
    }

    /* NAVIGATION, MODALS & INIT */
    function switchTab(name) {
      state.tab = name;
      document.querySelectorAll(".tab-panel").forEach(function (el) { el.classList.toggle("active", el.id === "tab-" + name); });
      document.querySelectorAll("[data-nav]").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-nav") === name); });
      const isHome = name === "home";
      document.getElementById("search-wrap").style.display = isHome ? "block" : "none";

      if (name === "cart") renderCart();
      if (name === "orders") renderOrders();
      if (name === "profile") renderProfile();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(id) { document.getElementById(id).classList.add("open"); document.body.style.overflow = "hidden"; }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); document.body.style.overflow = ""; }

    function renderAll() {
      updateTexts();
      updateBadges();
      renderCarousel();
      renderCategories();
      renderCityBanners();
      renderHomeProducts();
      if (state.tab === "cart") renderCart();
      if (state.tab === "orders") renderOrders();
      if (state.tab === "profile") renderProfile();
    }

    document.addEventListener("DOMContentLoaded", function () {
      applyTheme();
      renderAll();
      startAutoSlide();

      document.getElementById("btn-brand-home").addEventListener("click", function () { switchTab("home"); });
      document.getElementById("btn-lang").addEventListener("click", function () {
        const order = ["en", "am", "om"];
        setLanguage(order[(order.indexOf(state.lang) + 1) % 3]);
      });
      document.getElementById("btn-theme").addEventListener("click", function () {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
        if (state.tab === "profile") renderProfile();
      });
      document.getElementById("btn-wishlist").addEventListener("click", openWishlistModal);

      const sInp = document.getElementById("search-input");
      const sClr = document.getElementById("search-clear");
      sInp.addEventListener("input", function () {
        state.search = sInp.value;
        sClr.classList.toggle("show", state.search.length > 0);
        renderHomeProducts();
      });
      sClr.addEventListener("click", function () {
        state.search = ""; sInp.value = ""; sClr.classList.remove("show"); renderHomeProducts();
      });

      document.querySelectorAll("[data-nav]").forEach(function (b) {
        b.addEventListener("click", function () { switchTab(b.getAttribute("data-nav")); });
      });

      const cWrap = document.getElementById("carousel-wrap");
      const cTrack = document.getElementById("carousel-track");
      cTrack.addEventListener("click", function (e) {
        const card = e.target.closest("[data-bidx]");
        if (!card) return;
        const b = PROMO_BANNERS[Number(card.getAttribute("data-bidx"))];
        if (!b) return;
        if (b.action === "scroll") document.getElementById("sec-products").scrollIntoView({ behavior: "smooth" });
        else if (b.action === "partner") openPartnerModal(b.partnerId);
        else if (b.action === "info") openInfoModal(b);
        else if (b.action === "link" && b.url) window.open(b.url, "_blank", "noopener,noreferrer");
      });
      document.getElementById("carousel-dots").addEventListener("click", function (e) {
        const d = e.target.closest("[data-cdot]");
        if (d) { goBanner(Number(d.getAttribute("data-cdot"))); startAutoSlide(); }
      });
      let csT = null;
      cTrack.addEventListener("scroll", function () {
        if (csT) clearTimeout(csT);
        csT = setTimeout(function () {
          const padL = parseFloat(window.getComputedStyle(cTrack).paddingLeft) || 20;
          let best = 0, min = Infinity;
          Array.prototype.forEach.call(cTrack.children, function (el, i) {
            const dist = Math.abs((el.offsetLeft - padL) - cTrack.scrollLeft);
            if (dist < min) { min = dist; best = i; }
          });
          state.cIdx = best;
          document.querySelectorAll(".c-dot").forEach(function (d, i) { d.classList.toggle("active", i === state.cIdx); });
        }, 90);
      }, { passive: true });
      cWrap.addEventListener("touchstart", stopAutoSlide, { passive: true });
      cWrap.addEventListener("touchend", startAutoSlide, { passive: true });
      cWrap.addEventListener("mouseenter", stopAutoSlide);
      cWrap.addEventListener("mouseleave", startAutoSlide);

      document.getElementById("cat-row").addEventListener("click", function (e) {
        const b = e.target.closest("[data-cat]");
        if (b) { state.cat = b.getAttribute("data-cat"); renderCategories(); renderHomeProducts(); }
      });
      document.getElementById("btn-cat-all").addEventListener("click", function () { state.cat = "all"; renderCategories(); renderHomeProducts(); });
      document.getElementById("btn-deals-all").addEventListener("click", function () {
        state.cat = "deals"; renderCategories(); renderHomeProducts();
        document.getElementById("sec-products").scrollIntoView({ behavior: "smooth" });
      });
      document.getElementById("btn-req-item").addEventListener("click", function () {
        openTG(STORE_CONFIG.telegramUsername, "Hello Wollo Market! I would like to request an unlisted item: ");
      });

      document.getElementById("seg-active").addEventListener("click", function () { state.orderView = "active"; renderOrders(); });
      document.getElementById("seg-history").addEventListener("click", function () { state.orderView = "history"; renderOrders(); });

      document.getElementById("btn-ai-fab").addEventListener("click", function () { renderAi(); openModal("modal-ai"); });
      document.getElementById("ai-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const inp = document.getElementById("ai-input");
        sendAi(inp.value);
        inp.value = "";
      });
      document.getElementById("ai-chips").addEventListener("click", function (e) {
        const c = e.target.closest("[data-chip]");
        if (c) sendAi(c.getAttribute("data-chip"));
      });

      document.addEventListener("click", function (e) {
        const cityBtn = e.target.closest("[data-city]");
        if (cityBtn) {
          openCityDirectory(cityBtn.getAttribute("data-city"));
          return;
        }

        const dirTab = e.target.closest("[data-directory-tab]");
        if (dirTab) {
          directoryState.tab = dirTab.getAttribute("data-directory-tab");
          directoryState.category = "all";
          renderDirectory();
          return;
        }

        const dirCat = e.target.closest("[data-directory-category]");
        if (dirCat) {
          directoryState.category = dirCat.getAttribute("data-directory-category");
          renderDirectory();
          return;
        }

        const dirBackMalls = e.target.closest("[data-directory-back-malls]");
        if (dirBackMalls) {
          directoryState.view = "root";
          directoryState.tab = "malls";
          directoryState.mallId = null;
          directoryState.category = "all";
          renderDirectory();
          return;
        }

        const dirBack = e.target.closest("[data-directory-back]");
        if (dirBack) {
          if (directoryState.mallId) directoryState.view = "mall";
          else directoryState.view = "root";
          directoryState.shopRef = null;
          renderDirectory();
          return;
        }

        const dirMall = e.target.closest("[data-directory-mall]");
        if (dirMall) {
          directoryState.mallId = dirMall.getAttribute("data-directory-mall");
          directoryState.view = "mall";
          directoryState.category = "all";
          renderDirectory();
          return;
        }

        const dirShop = e.target.closest("[data-directory-shop]");
        if (dirShop) {
          const city = CITY_DIRECTORY.find(c => c.id === directoryState.cityId);
          const mall = directoryState.view === "mall" ? city.malls.find(m => m.id === directoryState.mallId) : null;
          const list = mall ? (mall.shops || []) : (city.normalShops || []);
          const shop = list.find(sh => sh.id === dirShop.getAttribute("data-directory-shop"));
          if (shop) openDirectoryShop(shop);
          return;
        }

        const cl = e.target.closest("[data-close]");
        if (cl) { closeModal(cl.getAttribute("data-close")); return; }
        if (e.target.classList.contains("modal-backdrop")) { closeModal(e.target.id); return; }

        const wBtn = e.target.closest("[data-wish]");
        if (wBtn) { e.stopPropagation(); toggleWish(Number(wBtn.getAttribute("data-wish"))); return; }

        const aBtn = e.target.closest("[data-add]");
        if (aBtn) { e.stopPropagation(); addCart(Number(aBtn.getAttribute("data-add"))); return; }

        const pCard = e.target.closest("[data-prod]");
        if (pCard) { openProductModal(Number(pCard.getAttribute("data-prod"))); return; }

        const wa = e.target.closest("[data-wadd]");
        if (wa) { addCart(Number(wa.getAttribute("data-wadd"))); return; }

        const wr = e.target.closest("[data-wrm]");
        if (wr) { toggleWish(Number(wr.getAttribute("data-wrm"))); openWishlistModal(); return; }

        const qd = e.target.closest("[data-qdec]");
        if (qd) { changeQty(Number(qd.getAttribute("data-qdec")), -1); return; }

        const qi = e.target.closest("[data-qinc]");
        if (qi) { changeQty(Number(qi.getAttribute("data-qinc")), 1); return; }

        const qx = e.target.closest("[data-qdel]");
        if (qx) {
          const id = Number(qx.getAttribute("data-qdel"));
          state.cart = state.cart.filter(function (c) { return c.id !== id; });
          writeLS(LS_KEYS.cart, state.cart); updateBadges(); renderCart(); return;
        }

        const cp = e.target.closest("[data-copy]");
        if (cp) { copyText(cp.getAttribute("data-copy")); return; }

        const pi = e.target.closest("[data-pitem]");
        if (pi) {
          const store = PARTNER_STORES[state.partnerId];
          if (store) {
            state.partnerItem = store.products.find(function (x) { return x.id === pi.getAttribute("data-pitem"); }) || null;
            renderPartnerBody();
          }
          return;
        }

        const rc = e.target.closest("[data-rec]");
        if (rc) {
          const ord = state.orders.find(function (o) { return o.id === rc.getAttribute("data-rec"); });
          if (ord) {
            ord.status = "delivered";
            writeLS(LS_KEYS.orders, state.orders);
            updateBadges();
            state.orderView = "history";
            renderOrders();
            toast(t("recToast"));
          }
          return;
        }

        const sl = e.target.closest("[data-setlang]");
        if (sl) { setLanguage(sl.getAttribute("data-setlang")); return; }
      });
    });
  </script>
</body>
</html>
