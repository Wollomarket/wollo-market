      document.getElementById("ai-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const inp = document.getElementById("ai-input");
        sendAi(inp.value);
        inp.value = "";
      });
      document.getElementById("ai-chips").addEventListener("click", function (e) {
        const c = e.target.closest("[data-chip]");
        if (c) sendAi(c.getAttribute("data-chip"));
      });

      document.addEventListener("click", function (e) {
        if(e.target.closest("#btn-owner-admin")){wmAdminUnlock();return;}
        if(e.target.closest("#btn-sell-product")){wmOpenSellForm();return;}
        if(e.target.closest("#btn-main-add")){wmProductEditor(null);return;}
        const mainEdit=e.target.closest("[data-main-edit]");if(mainEdit){const p=PRODUCTS.find(x=>String(x.id)===mainEdit.dataset.mainEdit);if(p)wmProductEditor(p);return;}
        const mainDel=e.target.closest("[data-main-delete]");if(mainDel){if(confirm("Delete this product?")){PRODUCTS=PRODUCTS.filter(x=>String(x.id)!==mainDel.dataset.mainDelete);renderHomeProducts();wmSaveMainProducts();}return;}
        if(e.target.closest("#pt-advertiser-lock")){const st=PARTNER_STORES[state.partnerId];if(st)wmPartnerUnlock(st);return;}
        if(e.target.closest("#pt-add-product")){const st=PARTNER_STORES[state.partnerId];const nm=prompt("Product name");if(nm){const price=Number(prompt("Price (Br)","0"));if(price>0){st.products.push({id:"custom-"+Date.now(),name:{en:nm,am:nm,om:nm},desc:{en:"",am:"",om:""},price:price,image:"minifan.jpg",icon:"package"});renderPartnerBody();const k=wmStorePinKey(st);writeLS("wm_partner_products_"+k,st.products);if(WM_TG_PROXY())fetch(WM_TG_PROXY(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:STORE_CONFIG.telegramChatId,text:"Partner product added: "+nm+" — "+price+" Br"})}).catch(()=>{});}}return;}
        const ptEdit=e.target.closest("[data-pt-edit]");if(ptEdit){const st=PARTNER_STORES[state.partnerId],it=st&&st.products.find(x=>String(x.id)===ptEdit.dataset.ptEdit);if(it){const nm=prompt("Product name",it.name.en);if(nm!==null){const pr=Number(prompt("Price (Br)",String(it.price)));if(pr>0){it.name={en:nm,am:nm,om:nm};it.price=pr;writeLS("wm_partner_products_"+wmStorePinKey(st),st.products);renderPartnerBody();}}}return;}
        const ptDel=e.target.closest("[data-pt-delete]");if(ptDel){const st=PARTNER_STORES[state.partnerId];if(st&&confirm("Delete this partner product?")){st.products=st.products.filter(x=>String(x.id)!==ptDel.dataset.ptDelete);writeLS("wm_partner_products_"+wmStorePinKey(st),st.products);renderPartnerBody();}return;}
        const sellerDel=e.target.closest("[data-list-delete]");if(sellerDel&&wmOwnerUnlocked){const id=sellerDel.dataset.listDelete;fetch(STORE_CONFIG.communityApiUrl.replace(/\.json$/,"/"+encodeURIComponent(id)+".json"),{method:"DELETE"}).then(r=>{if(!r.ok)throw new Error();wmSellerListings=wmSellerListings.filter(x=>String(x.id)!==id);localStorage.setItem(WM_LISTINGS_CACHE,JSON.stringify(wmSellerListings));wmRenderSellerListings(wmSellerListings);toast("Listing deleted.");}).catch(()=>toast("Could not delete listing."));return;}
        const cityBtn = e.target.closest("[data-city]");
        if (cityBtn) {
          openCityDirectory(cityBtn.getAttribute("data-city"));
          return;
        }

        const dirTab = e.target.closest("[data-directory-tab]");
        if (dirTab) {
          directoryState.tab = dirTab.getAttribute("data-directory-tab");
          directoryState.category = "all";
          renderDirectory();
          return;
        }

        const dirCat = e.target.closest("[data-directory-category]");
        if (dirCat) {
          directoryState.category = dirCat.getAttribute("data-directory-category");
          renderDirectory();
          return;
        }

        const dirBack = e.target.closest("[data-directory-back]");
        if (dirBack) {
          directoryState.view = "root";
          directoryState.tab = directoryState.mallId ? "malls" : "shops";
          directoryState.mallId = null;
          directoryState.shopRef = null;
          directoryState.category = "all";
          renderDirectory();
          return;
        }

        const dirMall = e.target.closest("[data-directory-mall]");
        if (dirMall) {
          const city = CITY_DIRECTORY.find(c => c.id === directoryState.cityId);
          const mall = city && (city.malls || []).find(m => m.id === dirMall.getAttribute("data-directory-mall"));
          if (mall) {
            directoryState.mallId = mall.id;
            directoryState.shopRef = mall;
            directoryState.view = "coming";
            renderDirectory();
          }
          return;
        }

        const dirShop = e.target.closest("[data-directory-shop]");
        if (dirShop) {
          const city = CITY_DIRECTORY.find(c => c.id === directoryState.cityId);
          return;
        }

        const cl = e.target.closest("[data-close]");
        if (cl) { closeModal(cl.getAttribute("data-close")); return; }
        if (e.target.classList.contains("modal-backdrop")) { closeModal(e.target.id); return; }

        const wBtn = e.target.closest("[data-wish]");
        if (wBtn) { e.stopPropagation(); toggleWish(Number(wBtn.getAttribute("data-wish"))); return; }

        const aBtn = e.target.closest("[data-add]");
        if (aBtn) { e.stopPropagation(); addCart(Number(aBtn.getAttribute("data-add"))); return; }

        const pCard = e.target.closest("[data-prod]");
        if (pCard) { openProductModal(Number(pCard.getAttribute("data-prod"))); return; }

        const wa = e.target.closest("[data-wadd]");
        if (wa) { addCart(Number(wa.getAttribute("data-wadd"))); return; }

        const wr = e.target.closest("[data-wrm]");
        if (wr) { toggleWish(Number(wr.getAttribute("data-wrm"))); openWishlistModal(); return; }

        const qd = e.target.closest("[data-qdec]");
        if (qd) { changeQty(Number(qd.getAttribute("data-qdec")), -1); return; }

        const qi = e.target.closest("[data-qinc]");
        if (qi) { changeQty(Number(qi.getAttribute("data-qinc")), 1); return; }

        const qx = e.target.closest("[data-qdel]");
        if (qx) {
          const id = Number(qx.getAttribute("data-qdel"));
          state.cart = state.cart.filter(function (c) { return c.id !== id; });
          writeLS(LS_KEYS.cart, state.cart); updateBadges(); renderCart(); return;
        }

        const cp = e.target.closest("[data-copy]");
        if (cp) { copyText(cp.getAttribute("data-copy")); return; }

        const pi = e.target.closest("[data-pitem]");
        if (pi) {
          state.partnerItem = null;
          state.partnerComingSoon = true;
          renderPartnerBody();
          return;
        }

        const rc = e.target.closest("[data-rec]");
        if (rc) {
          const ord = state.orders.find(function (o) { return o.id === rc.getAttribute("data-rec"); });
          if (ord) {
            ord.status = "delivered";
            writeLS(LS_KEYS.orders, state.orders);
            updateBadges();
            state.orderView = "history";
            renderOrders();
            toast(t("recToast"));
          }
          return;
        }

        const sl = e.target.closest("[data-setlang]");
        if (sl) { setLanguage(sl.getAttribute("data-setlang")); return; }
      });
    });
  </script>


  <div class="modal-backdrop" id="modal-sell">
    <div class="modal-sheet"><div class="modal-head"><strong id="sell-modal-title">Sell Your Product</strong><button type="button" class="modal-x" data-close="modal-sell">✕</button></div>
      <div class="modal-body" id="sell-form-body"></div>
    </div>
  </div>
</body>
</html>
